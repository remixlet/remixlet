name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Install dependencies
        run: nix develop -c task setup

      - name: Typecheck
        run: nix develop -c task typecheck

      - name: Lint
        run: nix develop -c task lint

      - name: Build Chrome extension
        run: nix develop -c task build

      - name: Build Firefox extension
        run: nix develop -c task build:firefox

      - name: Build limited Safari extension
        run: nix develop -c task build:safari

      - name: Test
        run: nix develop -c task test
